substitutions:
  _IMAGE_NAME: agent2agent
  _TAG: $SHORT_SHA
  _DOCKERFILE: docker/Dockerfile.good

steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: Build Image
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:${_TAG}',
      '-t', 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:latest',
      '-f', '${_DOCKERFILE}',
      '.'
    ]

  - name: 'gcr.io/cloud-builders/docker'
    id: Push Image
    args: [
      'push',
      '--all-tags',
      'gcr.io/$PROJECT_ID/${_IMAGE_NAME}'
    ]

images:
  - 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:${_TAG}'
  - 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:latest'
