substitutions:
  _IMAGE_NAME: agent2agent
  _TAG: $SHORT_SHA

steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: Build Image
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:${_TAG}',
      '-f', 'Dockerfile',
      '.'
    ]

  - name: 'gcr.io/cloud-builders/docker'
    id: Push Image
    args: [
      'push',
      'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:${_TAG}'
    ]

images:
  - 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:${_TAG}'
