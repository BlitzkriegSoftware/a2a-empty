apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: agent2agent-dev
spec:
  template:
    spec:
      containers:
        - image: gcr.io/YOUR_PROJECT_ID/agent2agent
          ports:
            - containerPort: 8080
          env:
            - name: ENV_STAGE
              value: "dev"
            - name: AGENT_API_KEY_DEV
              valueFrom:
                secretKeyRef:
                  name: AGENT_API_KEY_DEV
                  key: latest
      serviceAccountName: github-deployer@YOUR_PROJECT_ID.iam.gserviceaccount.com
  traffic:
    - latestRevision: true
      percent: 100
