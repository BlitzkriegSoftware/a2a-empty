apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: agent2agent-dev
spec:
  template:
    spec:
      containers:
      - image: gcr.io/PROJECT_ID/agent2agent
        ports:
        - containerPort: 8080
        env:
        - name: ENV_STAGE
          value: "dev"
      serviceAccountName: github-deployer@PROJECT_ID.iam.gserviceaccount.com
  traffic:
  - latestRevision: true
    percent: 100
