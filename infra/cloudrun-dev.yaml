apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: agent2agent-dev
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '10'
        autoscaling.knative.dev/minScale: '0'
    spec:
      serviceAccountName: cloudrun-agent-sa@<PROJECT_ID>.iam.gserviceaccount.com
      containers:
        - image: gcr.io/<PROJECT_ID>/agent2agent:latest
          ports:
            - containerPort: 8080
          env:
            - name: A2A_PORT
              value: "8080"
            - name: ENV_STAGE
              value: "dev"
            - name: AGENT_API_KEY_DEV
              valueFrom:
                secretKeyRef:
                  name: AGENT_API_KEY_DEV
                  key: latest
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
  traffic:
    - latestRevision: true
      percent: 100
