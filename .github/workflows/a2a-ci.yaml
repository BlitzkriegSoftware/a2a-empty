name: Manual Docker Build for Agent2Agent

on:
  workflow_dispatch:  # Manual trigger for Docker build

jobs:
  build: # only run this job if the workflow was manually triggered
    name: Manual Docker Build for Agent2Agent
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: dev

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract Git metadata
      id: meta
      run: |
        echo "GIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        echo "BRANCH_NAME=${GITHUB_REF##*/}" >> $GITHUB_ENV
        echo "BUILD_DATE=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3      

    - name: Build and Push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile.good
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/agent2agent:${{ env.BRANCH_NAME }}
          ${{ secrets.DOCKERHUB_USERNAME }}/agent2agent:${{ env.GIT_SHA }}
          ${{ secrets.DOCKERHUB_USERNAME }}/agent2agent:${{ env.BRANCH_NAME }}-${{ env.GIT_SHA }}
          ${{ secrets.DOCKERHUB_USERNAME }}/agent2agent:${{ env.BRANCH_NAME }}-${{ env.BUILD_DATE }}
