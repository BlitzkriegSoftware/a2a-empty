name: Manual Docker Build for Agent2Agent

on:
  workflow_dispatch:  # Manual trigger for Docker build

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r src/good/requirements.txt

    - name: Run tests
      run: pytest src/good/tests/


  build: # only run this job if the workflow was manually triggered
    name: Manual Docker Build for Agent2Agent
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract Git metadata
      id: meta
      run: |
        echo "GIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        echo "BRANCH_NAME=${GITHUB_REF##*/}" >> $GITHUB_ENV
        echo "BUILD_DATE=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

    - name: Set up Docker 
      uses: docker/setup-docker-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image (no push)
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile.good
        push: false
        tags: |
          agent2agent:${{ env.BRANCH_NAME }}
          agent2agent:${{ env.GIT_SHA }}
          agent2agent:${{ env.BRANCH_NAME }}-${{ env.GIT_SHA }}
          agent2agent:${{ env.BRANCH_NAME }}-${{ env.BUILD_DATE }}
