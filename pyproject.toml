[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "a2a-empty"
version = "0.1.0"
description = "A a2a wrapper"
authors = [{ name = "artivsolito" }]
readme = "README.md"
requires-python = ">=3.11,<4.0.0"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn>=0.29.0,<1.0.0",
    "a2a-sdk (>=0.3.10,<0.4.0)",
    "click (>=8.3.0,<9.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "pydantic (>=2.12.3,<3.0.0)",
    "sse-starlette (>=3.0.2,<4.0.0)",
    "starlette (>=0.49.0,<0.50.0)",
    "langchain-google-genai (>=3.0.0,<4.0.0)",
    "langgraph (>=1.0.1,<2.0.0)"
]

[tool.poetry]
packages = [
    { include = "good", from = "src" },
    { include = "bad", from = "src" },
    { include = "evil", from = "src" }
]

[tool.flake8]
max-line-length = 88
exclude = [
    ".venv",
    "__pycache__",
    "build",
    "dist"
]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["good", "bad", "evil"]
src_paths = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]
skip-string-normalization = false

[tool.pytest.ini_options]
testpaths = ["src"]
addopts = "--strict-markers"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4.2,<9.0.0"
black = ">=25.9.0,<26.0.0"
flake8 = ">=7.3.0,<8.0.0"
isort = ">=7.0.0,<8.0.0"
httpx = ">=0.28.1,<0.29.0"
